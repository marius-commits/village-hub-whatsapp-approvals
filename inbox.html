  <style>
  :root { --brown:#3A2412; --brown2:#6B4423; --gold:#C9A24B; --gold2:#E3C878; --olive:#8a9a5b; --cream:#F8F1E5;
    --ink:#2b2118; --muted:#6a5a4a; --line:#eadfcb; --white:#fffdf8; --bad:#b0472f; --ok:#2f6a2a; --bubble:#e9f0dc; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--cream); color:var(--ink); font-family:Inter,"Noto Sans",sans-serif; font-size:15px; }
  header { background:var(--brown); color:#fff; border-bottom:4px solid var(--gold); padding:10px 16px; display:flex; align-items:center; gap:12px; }
  header img { width:40px; height:40px; background:var(--cream); border-radius:10px; padding:3px; }

  #auth { max-width:440px; margin:40px auto; background:var(--white); border:1px solid var(--line); border-radius:12px; padding:20px; }

  .t .r { margin-left:auto; text-align:right; font-size:11px; color:var(--muted); white-space:nowrap; }

  #thread { flex:1; display:flex; flex-direction:column; min-width:0; }

<body>
<header>
  <img src="https://marius-commits.github.io/village-hub-whatsapp-approvals/logo.png" width="40" height="40" alt="The Village Hub logo">
  <div><h1>WhatsApp inbox</h1><small>The Village Hub · +27 63 260 3513</small></div>
  <div class="who" id="who"></div>
</header>
<div id="notice"></div>
<div id="auth" class="hidden"></div>
<div id="app" class="hidden">
  <div id="list"></div>
  <div id="thread">
    <div id="th-head"><span class="empty" style="padding:0">Pick a chat</span></div>
    <div id="msgs"></div>
    <div id="compose" class="hidden"></div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://lcrjcdlydlfrohtppmky.supabase.co';
const ANON = 'sb_publishable_o99egQoMPiyVoqxYGwhLEw_vzzX1fVo';
const API = SUPABASE_URL + '/functions/v1/wa-inbox-reply';
const ALLOW = ['marius@brick-field.co.za', 'christel@villagehub.co.za', 'francois@brick-field.co.za'];
const PAGE_TITLE = 'The Village Hub · WhatsApp inbox';
const LOGO = 'https://marius-commits.github.io/village-hub-whatsapp-approvals/logo.png';
const PAGE = 'https://marius-commits.github.io/village-hub-whatsapp-approvals/inbox.html';
const AUTH_KEY = 'vh-inbox-auth';
// One-time move of an existing session from the old default key, so nobody has to sign in again after this update.
try {
  const OLD_KEY = 'sb-lcrjcdlydlfrohtppmky-auth-token';
  if (!localStorage.getItem(AUTH_KEY) && localStorage.getItem(OLD_KEY)) localStorage.setItem(AUTH_KEY, localStorage.getItem(OLD_KEY));
} catch (e) {}
const sb = supabase.createClient(SUPABASE_URL, ANON, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage, storageKey: AUTH_KEY } });
const $ = (id) => document.getElementById(id);
let current = new URLSearchParams(location.search).get('c');
let threadData = null, sending = false, lastMsgCount = -1;
let threadSnapshot = {};
let realtimeOk = false, alertsOn = localStorage.getItem('vh_inbox_alerts') === '1';
const recentlyNotified = {};

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(ts) { if (!ts) return ''; return new Date(ts).toLocaleString('en-ZA', { timeZone:'Africa/Johannesburg', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) + ' SAST'; }
function short(ts) { if (!ts) return ''; const d = new Date(ts); const today = new Date().toDateString() === d.toDateString();
  return d.toLocaleString('en-ZA', today ? { timeZone:'Africa/Johannesburg', hour:'2-digit', minute:'2-digit' } : { timeZone:'Africa/Johannesburg', day:'numeric', month:'short' }); }
function note(msg, ok) { $('notice').innerHTML = msg ? `<div class="${ok ? 'ok' : 'err'}">${esc(msg)}</div>` : ''; if (msg) setTimeout(() => { if ($('notice').textContent === msg) $('notice').innerHTML = ''; }, 6000); }
function left(exp) { const ms = new Date(exp).getTime() - Date.now(); if (ms <= 0) return 'closed'; const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000); return `${h}h ${m}m left`; }

// Thrown only when the saved sign-in is truly gone (refresh token rejected), never for a stale access token.
class AuthGone extends Error {}
let refreshing = null;
async function refreshOnce() {
  if (!refreshing) refreshing = sb.auth.refreshSession().finally(() => { refreshing = null; });
  const { data, error } = await refreshing;
  if (data && data.session) return data.session;
  // Network trouble is not a sign-out: keep the saved session and let the next poll try again.
  if (error && (error.name === 'AuthRetryableFetchError' || !error.status)) throw new Error('Connection problem. Retrying shortly.');
  throw new AuthGone('Your sign-in has ended on this device. Please sign in again.');
}
async function api(path, opts = {}) {
  let { data: { session } } = await sb.auth.getSession();
  if (!session) throw new AuthGone('Sign in required');
  const call = (tok) => fetch(API + path, { method: opts.method || 'GET', headers: { authorization: 'Bearer ' + tok, apikey: ANON, 'content-type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  let res = await call(session.access_token);
  if (res.status === 401) { session = await refreshOnce(); res = await call(session.access_token); }
  if (opts.raw) return res;
  const j = await res.json().catch(() => ({}));
  if (!res.ok || j.ok === false) throw new Error(j.error || ('Request failed (' + res.status + ')'));
  return j;
}

function renderAuth(msg) {
  $('app').classList.add('hidden'); $('auth').classList.remove('hidden'); $('who').innerHTML = '';
  $('auth').innerHTML = `<h2 style="font-family:Poppins;margin:0 0 6px;color:var(--brown)">Staff sign-in</h2>
    <p class="hint">For marius@brick-field.co.za, christel@villagehub.co.za and francois@brick-field.co.za. You only need the emailed code once per device or browser. After that you stay signed in here. Once you're in, use <b>Set password</b> if you'd rather sign in with a password next time.</p>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <label for="email">Work email</label><input id="email" type="email" autocomplete="username">
    <div class="row"><button class="b-pri" id="send">Email me a code</button></div>
    <label for="otp">Code from the email</label><input id="otp" inputmode="numeric" autocomplete="one-time-code">
    <div class="row"><button class="b-dark" id="verify">Sign in</button></div>
    <div class="or"><label for="pw">Or sign in with your password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="row"><button class="b-dark" id="pwbtn">Sign in with password</button></div></div>`;
  $('send').onclick = async () => {
    const email = $('email').value.trim().toLowerCase();
    if (!ALLOW.includes(email)) return note('Only Marius, Christel and Francois can sign in.');
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: PAGE } });
    note(error ? error.message : 'Check your inbox for the code or link.', !error);
  };
  $('verify').onclick = async () => {
    const email = $('email').value.trim().toLowerCase(), token = $('otp').value.trim();
    const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
    if (error) note(error.message); else boot();
  };
  $('pwbtn').onclick = async () => {
    const email = $('email').value.trim().toLowerCase(), password = $('pw').value;
    if (!ALLOW.includes(email)) return note('Only Marius, Christel and Francois can sign in.');
    if (!password) return note('Type your password first.');
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) note(/invalid/i.test(error.message) ? 'Wrong email or password. If you have not set a password yet, use the emailed code.' : error.message); else boot();
  };
  $('pw').onkeydown = (e) => { if (e.key === 'Enter') $('pwbtn').click(); };
}

function openSetPassword() {
  if ($('pwmodal')) return;
  const m = document.createElement('div'); m.id = 'pwmodal';
  m.innerHTML = `<div class="card"><h2 style="font-family:Poppins;margin:0 0 6px;color:var(--brown)">Set password</h2>
    <p class="hint">Use at least 8 characters. Then you can sign in with your email and this password instead of a code.</p>
    <label for="np1">New password</label><input id="np1" type="password" autocomplete="new-password">
    <label for="np2">Repeat it</label><input id="np2" type="password" autocomplete="new-password">
    <div id="pwmsg"></div>
    <div class="row"><button class="b-pri" id="pwsave">Save password</button><button class="b-ghost" id="pwcancel">Close</button></div></div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  const say = (t, ok) => { $('pwmsg').innerHTML = `<div class="${ok ? 'ok' : 'err'}" style="margin-top:10px;box-shadow:none">${esc(t)}</div>`; };
  $('pwcancel').onclick = close;
  m.onclick = (e) => { if (e.target === m) close(); };
  $('np1').focus();
  $('pwsave').onclick = async () => {
    const a = $('np1').value, b = $('np2').value;
    if (a.length < 8) return say('Use at least 8 characters.');
    if (a !== b) return say('The two passwords do not match.');
    $('pwsave').disabled = true;
    const { error } = await sb.auth.updateUser({ password: a });
    $('pwsave').disabled = false;
    if (error) return say(error.message);
    say('Password saved. You can now sign in with your email and password.', true);
    $('np1').value = ''; $('np2').value = '';
    setTimeout(close, 2500);
  };
}

async function authFailed(e) {
  if (!(e instanceof AuthGone)) { note(e.message); return; }
  await sb.auth.signOut({ scope: 'local' }).catch(() => {});
  renderAuth(e.message);
}

function threadName(t) {
  const c = t.contact || {};
  return t.profile_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || c.phone_e164 || t.wa_id || 'a contact';
}

async function loadThreads(opts = {}) {
  const j = await api('/threads');
  const alertLabel = alertsOn && notificationGranted() ? 'Alerts on' : 'Enable alerts';
  const alertClass = alertsOn && notificationGranted() ? 'alert-btn on' : 'alert-btn';
  $('who').innerHTML = `<span>${esc(j.me.email)} </span><button class="${alertClass}" id="alerts">${alertLabel}</button> <button class="b-ghost" style="color:#fff" id="setpw">Set password</button> <button class="b-ghost" style="color:#fff" id="out">Sign out</button>`;
  $('setpw').onclick = () => openSetPassword();
  $('out').onclick = async () => { await sb.auth.signOut(); renderAuth(''); };
  $('alerts').onclick = () => enableAlerts();
  showIosTip();
  const total = j.threads.reduce((a, t) => a + (t.unread_count || 0), 0);
  document.title = (total ? `(${total}) ` : '') + PAGE_TITLE;
  if (opts.detect) {
    for (const t of j.threads) {
      const prev = threadSnapshot[t.id];
      if (t.last_direction === 'in' && t.last_message_at && prev && t.last_message_at > prev) {
        const looking = !document.hidden && current === t.id;
        if (!looking) notifyInbound({ name: threadName(t), body: t.last_message_preview || '', conversationId: t.id });
      }
    }
  }
  threadSnapshot = Object.fromEntries((j.threads || []).map((t) => [t.id, t.last_message_at || '']));
  $('list').innerHTML = (j.sending_ready ? '' : `<div class="err" style="margin:10px;box-shadow:none">Replies are off until the Meta token is saved in Supabase. Incoming chats still show here.</div>`) +
    (j.threads.length ? j.threads.map((t) => {
      const c = t.contact || {}; const name = t.profile_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || c.phone_e164 || t.wa_id;
      return `<div class="t ${t.id === current ? 'sel' : ''}" data-id="${t.id}"><div style="min-width:0">
        <div class="n">${esc(name)}</div><div class="p">${t.last_direction === 'out' ? 'You: ' : ''}${esc(t.last_message_preview || '')}</div>
        <div>${t.opted_out ? '<span class="pill stop">opted out</span>' : (t.window_open ? '<span class="pill open">24h open</span>' : '<span class="pill closed">template only</span>')}</div></div>
        <div class="r">${short(t.last_message_at)}<br>${t.unread_count ? `<span class="badge">${t.unread_count}</span>` : ''}</div></div>`;
    }).join('') : '<div class="empty">No chats yet. Message +27 63 260 3513 to test.</div>');
  document.querySelectorAll('.t').forEach((el) => el.onclick = () => openThread(el.dataset.id));
}

async function openThread(id, quiet) {
  current = id; history.replaceState(null, '', '?c=' + id);
  $('app').classList.add('show-thread');
  document.querySelectorAll('.t').forEach((el) => el.classList.toggle('sel', el.dataset.id === id));
  const j = await api('/thread?id=' + encodeURIComponent(id));
  threadData = j;
  const c = j.contact || {}, conv = j.conversation;
  const name = conv.profile_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || c.phone_e164;
  $('th-head').innerHTML = `<button class="b-ghost back" id="back">←</button><div><b>${esc(name)}</b><div class="hint">${esc(c.phone_e164 || '')} · ${j.opted_out ? 'opted out (STOP)' : (j.window_open ? 'reply window ' + left(conv.window_expires_at) : '24h window closed, templates only')}</div></div>`;
  $('back').onclick = () => { $('app').classList.remove('show-thread'); current = null; history.replaceState(null, '', location.pathname); loadThreads(); };
  const box = $('msgs'); const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = j.messages.map((m) => {
    const media = m.media_id ? `<div class="row"><button class="b-ghost" data-media="${esc(m.media_id)}" data-mime="${esc(m.media_mime || '')}" data-fn="${esc(m.media_filename || '')}">Open ${esc(m.msg_type)}${m.media_filename ? ': ' + esc(m.media_filename) : ''}</button></div>` : '';
    const st = m.direction === 'out' ? ` · ${esc(m.status)}${m.sent_by_email ? ' · ' + esc(m.sent_by_email.split('@')[0]) : ''}${m.template_name ? ' · template ' + esc(m.template_name) : ''}${m.error_detail ? ' · ' + esc(m.error_detail) : ''}` : '';
    return `<div class="m ${m.direction}">${esc(m.body)}${media}<div class="meta">${fmt(m.wa_timestamp || m.created_at)}${st}</div></div>`;
  }).join('') || '<div class="empty">No messages</div>';
  box.querySelectorAll('[data-media]').forEach((b) => b.onclick = () => openMedia(b.dataset.media, b.dataset.fn));
  if (!quiet || atBottom || j.messages.length !== lastMsgCount) box.scrollTop = box.scrollHeight;
  lastMsgCount = j.messages.length;
  if (!quiet || !$('compose').innerHTML) renderCompose(j);
  if (conv.unread_count) { api('/read', { method: 'POST', body: { id } }).then(loadThreads).catch(() => {}); }
}

function renderCompose(j) {
  const el = $('compose'); el.classList.remove('hidden');
  if (j.opted_out) { el.innerHTML = '<div class="hint">This contact opted out (STOP). Sending is blocked. If they text START, replies open again.</div>'; return; }
  if (!j.sending_ready) { el.innerHTML = '<div class="hint">Replies are off until the Meta token is saved in Supabase. Nothing can be sent yet.</div>'; return; }
  const supported = (j.templates || []).filter((t) => t.supported);
  const tplOpts = supported.map((t, i) => `<option value="${i}">${esc(t.name)} (${esc(t.language)})</option>`).join('');
  if (j.window_open) {
    el.innerHTML = `<textarea id="txt" placeholder="Type a reply. It goes out from +27 63 260 3513 when you press Send."></textarea>
      <div class="row"><button class="b-pri" id="sendbtn">Send</button><span class="hint">Free text allowed: ${left(j.conversation.window_expires_at)} in the 24h window.</span></div>`;
    $('sendbtn').onclick = () => send({ text: $('txt').value });
    $('txt').onkeydown = (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send({ text: $('txt').value }); };
  } else {
    el.innerHTML = `<div class="hint">The 24-hour window is closed. You can only send a Meta-approved template.${j.templates_error ? ' (' + esc(j.templates_error) + ')' : ''}</div>
      ${supported.length ? `<select id="tpl"><option value="">Choose an approved template…</option>${tplOpts}</select><div id="tplf"></div>
      <div class="row"><button class="b-pri" id="sendbtn" disabled>Send template</button></div>` : '<div class="hint">No approved templates yet.</div>'}`;
    if (!supported.length) return;
    $('tpl').onchange = () => {
      const t = supported[$('tpl').value]; $('sendbtn').disabled = !t;
      $('tplf').innerHTML = t ? `<div class="m out" style="max-width:100%">${esc(t.header ? t.header + '\n' : '')}${esc(t.body)}</div>` +
        t.header_params.map((p) => `<label>Header {{${esc(p)}}}</label><input data-h="${esc(p)}">`).join('') +
        t.body_params.map((p) => `<label>{{${esc(p)}}}</label><input data-p="${esc(p)}">`).join('') : '';
    };
    $('sendbtn').onclick = () => {
      const t = supported[$('tpl').value]; if (!t) return;
      const params = {}, header_params = {};
      document.querySelectorAll('[data-p]').forEach((i) => params[i.dataset.p] = i.value);
      document.querySelectorAll('[data-h]').forEach((i) => header_params[i.dataset.h] = i.value);
      send({ template: { name: t.name, language: t.language, params, header_params } });
    };
  }
}

async function send(body) {
  if (sending) return;
  if (body.text !== undefined && !body.text.trim()) return note('Type a message first.');
  sending = true; const btn = $('sendbtn'); if (btn) btn.disabled = true;
  try {
    const r = await api('/send', { method: 'POST', body: { ...body, conversation_id: current, client_ref: crypto.randomUUID(), human_confirmed: true } });
    note(r.duplicate ? 'Already sent.' : 'Sent from +27 63 260 3513.', true);
    await openThread(current); await loadThreads();
  } catch (e) { note(e.message); if (btn) btn.disabled = false; }
  finally { sending = false; }
}

async function openMedia(id, fn) {
  try {
    const res = await api('/media?id=' + encodeURIComponent(id), { raw: true });
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || 'Could not load the file'); }
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; if (fn) a.download = fn; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { note(e.message); }
}

function notificationGranted() { return typeof Notification !== 'undefined' && Notification.permission === 'granted'; }
function isIos() { return /iphone|ipad|ipod/i.test(navigator.userAgent || ''); }
function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }

function showIosTip() {
  let el = document.getElementById('ios-tip');
  if (!isIos() || isStandalone() || !alertsOn) {
    if (el) el.remove();
    return;
  }
  if (el) return;
  el = document.createElement('div');
  el.id = 'ios-tip';
  el.textContent = 'On iPhone, add this inbox to your Home Screen (Share, then Add to Home Screen) so pop-ups can appear when the tab is in the background.';
  const app = $('app');
  app.parentNode.insertBefore(el, app);
}

function playDing() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = playDing._ctx || (playDing._ctx = new Ctx());
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.18);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.1, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.4);
  } catch (e) {}
}

async function enableAlerts() {
  if (typeof Notification === 'undefined') {
    note('This browser cannot show pop-up alerts. Keep the inbox tab open for a sound and an unread count in the title.');
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') {
    note('Pop-up alerts were not allowed. You can turn them on in the browser settings for this page.');
    alertsOn = false;
    localStorage.removeItem('vh_inbox_alerts');
    return;
  }
  alertsOn = true;
  localStorage.setItem('vh_inbox_alerts', '1');
  try { await navigator.serviceWorker.register('inbox-sw.js', { scope: './' }); } catch (e) {}
  if ($('app') && !$('app').classList.contains('hidden')) await loadThreads();
  note('Alerts are on. Leave this tab open, even in the background, to get a sound and a pop-up when a new message arrives.', true);
}

function notifyInbound({ name, body, conversationId }) {
  const looking = !document.hidden && current === conversationId;
  if (looking) return;
  if (!alertsOn) return;
  const key = (conversationId || '') + '|' + String(body || '');
  if (recentlyNotified[key] && Date.now() - recentlyNotified[key] < 8000) return;
  recentlyNotified[key] = Date.now();
  playDing();
  if (!notificationGranted()) return;
  const title = name ? ('WhatsApp from ' + name) : 'New WhatsApp message';
  const text = String(body || '').slice(0, 140);
  const opts = { body: text, icon: LOGO, badge: LOGO, tag: 'vh-inbox-' + (conversationId || 'all'), renotify: true, data: { c: conversationId } };
  const click = () => { try { window.focus(); } catch (e) {} if (conversationId) openThread(conversationId); };
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({ type: 'notify', title, ...opts });
  } else {
    try {
      const n = new Notification(title, opts);
      n.onclick = () => { click(); n.close(); };
    } catch (e) {}
  }
}

function startRealtime() {
  if (startRealtime._on) return;
  startRealtime._on = true;
  sb.channel('wa-inbox-in')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wa_messages', filter: 'direction=eq.in' }, async (payload) => {
      const m = payload.new || {};
      try {
        await loadThreads({ detect: true });
        if (current === m.conversation_id && !document.hidden) {
          const typing = document.activeElement && ['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName);
          if (!typing) await openThread(current, true);
        }
      } catch (e) {}
    })
    .subscribe((status) => { realtimeOk = status === 'SUBSCRIBED'; });
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderAuth('');
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
  if (alertsOn && notificationGranted() && navigator.serviceWorker) {
    navigator.serviceWorker.register('inbox-sw.js', { scope: './' }).catch(() => {});
  }
  if (navigator.serviceWorker) {
    navigator.serviceWorker.addEventListener('message', (ev) => {
      if (ev.data && ev.data.type === 'open' && ev.data.c) openThread(ev.data.c);
    });
  }
  try {
    await loadThreads();
    if (current) await openThread(current);
    startRealtime();
  } catch (e) { await authFailed(e); }
}
setInterval(async () => {
  if ($('app').classList.contains('hidden')) return;
  try {
    await loadThreads({ detect: true });
    if (current && !document.hidden && !(document.activeElement && ['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName))) {
      await openThread(current, true);
    }
  } catch (e) { if (e instanceof AuthGone) authFailed(e); }
}, 10000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !$('app').classList.contains('hidden')) {
    loadThreads().then(() => { if (current) openThread(current, true); }).catch((e) => { if (e instanceof AuthGone) authFailed(e); });
  }
});
// Run boot outside the auth callback (supabase-js advice) so it cannot block the auth lock.
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN') setTimeout(boot, 0); });
boot();
</script>
