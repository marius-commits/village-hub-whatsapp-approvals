<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Village Hub · WhatsApp inbox</title>
  <meta name="description" content="Shared WhatsApp inbox for The Village Hub (+27 63 260 3513). Staff sign-in for Marius and Christel to read chats and reply.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#3A2412">
  <link rel="canonical" href="https://marius-commits.github.io/village-hub-whatsapp-approvals/inbox.html">
  <link rel="icon" href="https://marius-commits.github.io/village-hub-whatsapp-approvals/favicon.ico" sizes="32x32" type="image/x-icon">
  <link rel="icon" href="https://marius-commits.github.io/village-hub-whatsapp-approvals/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="https://marius-commits.github.io/village-hub-whatsapp-approvals/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Village Hub">
  <meta property="og:title" content="The Village Hub · WhatsApp inbox">
  <meta property="og:description" content="Shared WhatsApp inbox for The Village Hub. Staff sign-in only.">
  <meta property="og:url" content="https://marius-commits.github.io/village-hub-whatsapp-approvals/inbox.html">
  <meta property="og:image" content="https://marius-commits.github.io/village-hub-whatsapp-approvals/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Village Hub · WhatsApp inbox">
  <meta name="twitter:description" content="Shared WhatsApp inbox for The Village Hub. Staff sign-in only.">
  <meta name="twitter:image" content="https://marius-commits.github.io/village-hub-whatsapp-approvals/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
  :root { --brown:#3A2412; --brown2:#6B4423; --gold:#C9A24B; --gold2:#E3C878; --olive:#8a9a5b; --cream:#F8F1E5;
    --ink:#2b2118; --muted:#6a5a4a; --line:#eadfcb; --white:#fffdf8; --bad:#b0472f; --ok:#2f6a2a; --bubble:#e9f0dc; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--cream); color:var(--ink); font-family:Inter,"Noto Sans",sans-serif; font-size:15px; }
  header { background:var(--brown); color:#fff; border-bottom:4px solid var(--gold); padding:10px 16px; display:flex; align-items:center; gap:12px; }
  header img { width:40px; height:40px; background:var(--cream); border-radius:10px; padding:3px; }
  header h1 { font-family:Poppins,sans-serif; font-size:18px; margin:0; }
  header small { color:var(--gold2); display:block; font-size:12px; }
  header .who { margin-left:auto; font-size:12px; color:var(--gold2); text-align:right; }
  button { font-family:Poppins,sans-serif; border:0; border-radius:999px; padding:8px 14px; cursor:pointer; font-size:13px; }
  .b-pri { background:var(--olive); color:#fff; } .b-dark { background:var(--brown); color:#fff; }
  .b-ghost { background:transparent; color:inherit; border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #notice { position:fixed; left:50%; transform:translateX(-50%); top:70px; z-index:9; max-width:92vw; }
  .err, .ok { padding:10px 14px; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .err { background:#fbeee0; border-left:4px solid var(--bad); } .ok { background:#e8f3e6; border-left:4px solid var(--ok); }
  #auth { max-width:440px; margin:40px auto; background:var(--white); border:1px solid var(--line); border-radius:12px; padding:20px; }
  label { display:block; font-weight:600; margin:10px 0 6px; color:var(--brown); }
  input, textarea, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; color:var(--ink); }
  #app { display:flex; height:calc(100vh - 64px); height:calc(100dvh - 64px); }
  #list { width:340px; border-right:1px solid var(--line); overflow-y:auto; background:var(--white); }
  .t { padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:10px; }
  .t:hover, .t.sel { background:#f3ead8; }
  .t .n { font-weight:600; } .t .p { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
  .t .r { margin-left:auto; text-align:right; font-size:11px; color:var(--muted); white-space:nowrap; }
  .badge { display:inline-block; background:var(--olive); color:#fff; border-radius:999px; min-width:20px; padding:1px 6px; font-size:11px; font-weight:700; text-align:center; margin-top:4px; }
  .pill { display:inline-block; padding:1px 7px; border-radius:999px; font-size:10.5px; font-weight:700; background:#eee; color:#555; }
  .pill.open { background:#dfeedd; color:var(--ok); } .pill.closed { background:#fff3c4; color:#6a4b00; } .pill.stop { background:#f6d9d2; color:var(--bad); }
  #thread { flex:1; display:flex; flex-direction:column; min-width:0; }
  #th-head { padding:10px 14px; border-bottom:1px solid var(--line); background:var(--white); display:flex; gap:10px; align-items:center; }
  #th-head .back { display:none; }
  #msgs { flex:1; overflow-y:auto; padding:14px; }
  .m { max-width:78%; margin:6px 0; padding:8px 11px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; box-shadow:0 1px 1px rgba(0,0,0,.06); }
  .m.in { background:#fff; } .m.out { background:var(--bubble); margin-left:auto; }
  .m .meta { font-size:11px; color:var(--muted); margin-top:4px; }
  #compose { border-top:1px solid var(--line); background:var(--white); padding:10px 14px; }
  #compose textarea { min-height:64px; resize:vertical; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .hint { font-size:12px; color:var(--muted); }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  .hidden { display:none !important; }
  @media (max-width:760px) {
    #list { width:100%; border-right:0; }
    #app.show-thread #list { display:none; } #app:not(.show-thread) #thread { display:none; }
    #th-head .back { display:inline-block; } .m { max-width:88%; }
    header .who span { display:none; }
  }
</style>
</head>
<body>
<header>
  <img src="https://marius-commits.github.io/village-hub-whatsapp-approvals/logo.png" width="40" height="40" alt="The Village Hub logo">
  <div><h1>WhatsApp inbox</h1><small>The Village Hub · +27 63 260 3513</small></div>
  <div class="who" id="who"></div>
</header>
<div id="notice"></div>
<div id="auth" class="hidden"></div>
<div id="app" class="hidden">
  <div id="list"></div>
  <div id="thread">
    <div id="th-head"><span class="empty" style="padding:0">Pick a chat</span></div>
    <div id="msgs"></div>
    <div id="compose" class="hidden"></div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://lcrjcdlydlfrohtppmky.supabase.co';
const ANON = 'sb_publishable_o99egQoMPiyVoqxYGwhLEw_vzzX1fVo';
const API = SUPABASE_URL + '/functions/v1/wa-inbox-reply';
const ALLOW = ['marius@brick-field.co.za', 'christel@villagehub.co.za'];
const PAGE = 'https://marius-commits.github.io/village-hub-whatsapp-approvals/inbox.html';
const sb = supabase.createClient(SUPABASE_URL, ANON, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const $ = (id) => document.getElementById(id);
let current = new URLSearchParams(location.search).get('c');
let threadData = null, sending = false, lastMsgCount = -1;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(ts) { if (!ts) return ''; return new Date(ts).toLocaleString('en-ZA', { timeZone:'Africa/Johannesburg', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) + ' SAST'; }
function short(ts) { if (!ts) return ''; const d = new Date(ts); const today = new Date().toDateString() === d.toDateString();
  return d.toLocaleString('en-ZA', today ? { timeZone:'Africa/Johannesburg', hour:'2-digit', minute:'2-digit' } : { timeZone:'Africa/Johannesburg', day:'numeric', month:'short' }); }
function note(msg, ok) { $('notice').innerHTML = msg ? `<div class="${ok ? 'ok' : 'err'}">${esc(msg)}</div>` : ''; if (msg) setTimeout(() => { if ($('notice').textContent === msg) $('notice').innerHTML = ''; }, 6000); }
function left(exp) { const ms = new Date(exp).getTime() - Date.now(); if (ms <= 0) return 'closed'; const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000); return `${h}h ${m}m left`; }

async function api(path, opts = {}) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('Sign in required');
  const res = await fetch(API + path, { method: opts.method || 'GET', headers: { authorization: 'Bearer ' + session.access_token, apikey: ANON, 'content-type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (opts.raw) return res;
  const j = await res.json().catch(() => ({}));
  if (!res.ok || j.ok === false) throw new Error(j.error || ('Request failed (' + res.status + ')'));
  return j;
}

function renderAuth(msg) {
  $('app').classList.add('hidden'); $('auth').classList.remove('hidden'); $('who').innerHTML = '';
  $('auth').innerHTML = `<h2 style="font-family:Poppins;margin:0 0 6px;color:var(--brown)">Staff sign-in</h2>
    <p class="hint">For marius@brick-field.co.za and christel@villagehub.co.za. We email you a code.</p>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <label for="email">Work email</label><input id="email" type="email" autocomplete="username">
    <div class="row"><button class="b-pri" id="send">Email me a code</button></div>
    <label for="otp">Code from the email</label><input id="otp" inputmode="numeric" autocomplete="one-time-code">
    <div class="row"><button class="b-dark" id="verify">Sign in</button></div>`;
  $('send').onclick = async () => {
    const email = $('email').value.trim().toLowerCase();
    if (!ALLOW.includes(email)) return note('Only the two Village Hub staff inboxes can sign in.');
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: PAGE } });
    note(error ? error.message : 'Check your inbox for the code or link.', !error);
  };
  $('verify').onclick = async () => {
    const email = $('email').value.trim().toLowerCase(), token = $('otp').value.trim();
    const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
    if (error) note(error.message); else boot();
  };
}

async function loadThreads() {
  const j = await api('/threads');
  $('who').innerHTML = `<span>${esc(j.me.email)} </span><button class="b-ghost" style="color:#fff" id="out">Sign out</button>`;
  $('out').onclick = async () => { await sb.auth.signOut(); renderAuth(''); };
  const total = j.threads.reduce((a, t) => a + (t.unread_count || 0), 0);
  document.title = (total ? `(${total}) ` : '') + 'The Village Hub · WhatsApp inbox';
  $('list').innerHTML = (j.sending_ready ? '' : `<div class="err" style="margin:10px;box-shadow:none">Replies are off until the Meta token is saved in Supabase. Incoming chats still show here.</div>`) +
    (j.threads.length ? j.threads.map((t) => {
      const c = t.contact || {}; const name = t.profile_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || c.phone_e164 || t.wa_id;
      return `<div class="t ${t.id === current ? 'sel' : ''}" data-id="${t.id}"><div style="min-width:0">
        <div class="n">${esc(name)}</div><div class="p">${t.last_direction === 'out' ? 'You: ' : ''}${esc(t.last_message_preview || '')}</div>
        <div>${t.opted_out ? '<span class="pill stop">opted out</span>' : (t.window_open ? '<span class="pill open">24h open</span>' : '<span class="pill closed">template only</span>')}</div></div>
        <div class="r">${short(t.last_message_at)}<br>${t.unread_count ? `<span class="badge">${t.unread_count}</span>` : ''}</div></div>`;
    }).join('') : '<div class="empty">No chats yet. Message +27 63 260 3513 to test.</div>');
  document.querySelectorAll('.t').forEach((el) => el.onclick = () => openThread(el.dataset.id));
}

async function openThread(id, quiet) {
  current = id; history.replaceState(null, '', '?c=' + id);
  $('app').classList.add('show-thread');
  document.querySelectorAll('.t').forEach((el) => el.classList.toggle('sel', el.dataset.id === id));
  const j = await api('/thread?id=' + encodeURIComponent(id));
  threadData = j;
  const c = j.contact || {}, conv = j.conversation;
  const name = conv.profile_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || c.phone_e164;
  $('th-head').innerHTML = `<button class="b-ghost back" id="back">←</button><div><b>${esc(name)}</b><div class="hint">${esc(c.phone_e164 || '')} · ${j.opted_out ? 'opted out (STOP)' : (j.window_open ? 'reply window ' + left(conv.window_expires_at) : '24h window closed, templates only')}</div></div>`;
  $('back').onclick = () => { $('app').classList.remove('show-thread'); current = null; history.replaceState(null, '', location.pathname); loadThreads(); };
  const box = $('msgs'); const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = j.messages.map((m) => {
    const media = m.media_id ? `<div class="row"><button class="b-ghost" data-media="${esc(m.media_id)}" data-mime="${esc(m.media_mime || '')}" data-fn="${esc(m.media_filename || '')}">Open ${esc(m.msg_type)}${m.media_filename ? ': ' + esc(m.media_filename) : ''}</button></div>` : '';
    const st = m.direction === 'out' ? ` · ${esc(m.status)}${m.sent_by_email ? ' · ' + esc(m.sent_by_email.split('@')[0]) : ''}${m.template_name ? ' · template ' + esc(m.template_name) : ''}${m.error_detail ? ' · ' + esc(m.error_detail) : ''}` : '';
    return `<div class="m ${m.direction}">${esc(m.body)}${media}<div class="meta">${fmt(m.wa_timestamp || m.created_at)}${st}</div></div>`;
  }).join('') || '<div class="empty">No messages</div>';
  box.querySelectorAll('[data-media]').forEach((b) => b.onclick = () => openMedia(b.dataset.media, b.dataset.fn));
  if (!quiet || atBottom || j.messages.length !== lastMsgCount) box.scrollTop = box.scrollHeight;
  lastMsgCount = j.messages.length;
  if (!quiet || !$('compose').innerHTML) renderCompose(j);
  if (conv.unread_count) { api('/read', { method: 'POST', body: { id } }).then(loadThreads).catch(() => {}); }
}

function renderCompose(j) {
  const el = $('compose'); el.classList.remove('hidden');
  if (j.opted_out) { el.innerHTML = '<div class="hint">This contact opted out (STOP). Sending is blocked. If they text START, replies open again.</div>'; return; }
  if (!j.sending_ready) { el.innerHTML = '<div class="hint">Replies are off until the Meta token is saved in Supabase. Nothing can be sent yet.</div>'; return; }
  const supported = (j.templates || []).filter((t) => t.supported);
  const tplOpts = supported.map((t, i) => `<option value="${i}">${esc(t.name)} (${esc(t.language)})</option>`).join('');
  if (j.window_open) {
    el.innerHTML = `<textarea id="txt" placeholder="Type a reply. It goes out from +27 63 260 3513 when you press Send."></textarea>
      <div class="row"><button class="b-pri" id="sendbtn">Send</button><span class="hint">Free text allowed: ${left(j.conversation.window_expires_at)} in the 24h window.</span></div>`;
    $('sendbtn').onclick = () => send({ text: $('txt').value });
    $('txt').onkeydown = (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send({ text: $('txt').value }); };
  } else {
    el.innerHTML = `<div class="hint">The 24-hour window is closed. You can only send a Meta-approved template.${j.templates_error ? ' (' + esc(j.templates_error) + ')' : ''}</div>
      ${supported.length ? `<select id="tpl"><option value="">Choose an approved template…</option>${tplOpts}</select><div id="tplf"></div>
      <div class="row"><button class="b-pri" id="sendbtn" disabled>Send template</button></div>` : '<div class="hint">No approved templates yet.</div>'}`;
    if (!supported.length) return;
    $('tpl').onchange = () => {
      const t = supported[$('tpl').value]; $('sendbtn').disabled = !t;
      $('tplf').innerHTML = t ? `<div class="m out" style="max-width:100%">${esc(t.header ? t.header + '\n' : '')}${esc(t.body)}</div>` +
        t.header_params.map((p) => `<label>Header {{${esc(p)}}}</label><input data-h="${esc(p)}">`).join('') +
        t.body_params.map((p) => `<label>{{${esc(p)}}}</label><input data-p="${esc(p)}">`).join('') : '';
    };
    $('sendbtn').onclick = () => {
      const t = supported[$('tpl').value]; if (!t) return;
      const params = {}, header_params = {};
      document.querySelectorAll('[data-p]').forEach((i) => params[i.dataset.p] = i.value);
      document.querySelectorAll('[data-h]').forEach((i) => header_params[i.dataset.h] = i.value);
      send({ template: { name: t.name, language: t.language, params, header_params } });
    };
  }
}

async function send(body) {
  if (sending) return;
  if (body.text !== undefined && !body.text.trim()) return note('Type a message first.');
  sending = true; const btn = $('sendbtn'); if (btn) btn.disabled = true;
  try {
    const r = await api('/send', { method: 'POST', body: { ...body, conversation_id: current, client_ref: crypto.randomUUID(), human_confirmed: true } });
    note(r.duplicate ? 'Already sent.' : 'Sent from +27 63 260 3513.', true);
    await openThread(current); await loadThreads();
  } catch (e) { note(e.message); if (btn) btn.disabled = false; }
  finally { sending = false; }
}

async function openMedia(id, fn) {
  try {
    const res = await api('/media?id=' + encodeURIComponent(id), { raw: true });
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || 'Could not load the file'); }
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; if (fn) a.download = fn; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { note(e.message); }
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderAuth('');
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
  try { await loadThreads(); if (current) await openThread(current); }
  catch (e) { if (/sign in|session|approver/i.test(e.message)) { await sb.auth.signOut(); renderAuth(e.message); } else note(e.message); }
}
setInterval(async () => {
  if ($('app').classList.contains('hidden') || document.hidden) return;
  try { await loadThreads(); if (current && !(document.activeElement && ['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName))) await openThread(current, true); } catch {}
}, 10000);
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN') boot(); });
boot();
</script>
</body>
</html>
